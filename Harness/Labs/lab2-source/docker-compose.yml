# Local development. In production the database is a managed cluster; this
# brings up an equivalent schema so you can run the platform on a laptop.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: brayford
      POSTGRES_PASSWORD: brayford
      POSTGRES_DB: brayford
    ports: ["55434:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brayford"]
      interval: 3s
      retries: 10
