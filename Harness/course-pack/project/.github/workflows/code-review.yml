# Reviews every pull request with claude-code-action and the code-review plugin.
#
# Two lines in this file decide whether the thing works at all, and neither of them is
# obvious from reading it. Both are commented in place below. Lab 3 hands you this file
# with those two lines removed.
name: Code Review

on:
  pull_request:
    # synchronize fires on every push to the branch, not only when the pull request
    # opens, so a 20 commit pull request is 20 full reviews at full token cost. That is
    # the main cost lever in this file. Drop synchronize and you review once on open and
    # once when a draft is marked ready.
    #
    # Note also that on a public repository GitHub withholds secrets from fork pull
    # request runs, so this workflow silently does nothing for external contributors.
    # The safe fix is the repository setting that requires approval before a run from an
    # external contributor starts, never pull_request_target.
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    runs-on: ubuntu-latest

    # Read only. The job that runs the model cannot comment, push or label under these
    # scopes, so an instruction injected through the diff has nothing to reach for.
    # id-token: write is OIDC for the action's own token exchange, not write access to
    # the repository contents.
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

          # NON OBVIOUS LINE 1 OF 2.
          # --comment is what makes findings land on the pull request. Without it the run
          # completes, the review happens, the output goes to the job log, and no comment
          # is ever created. The flag is what routes each finding to an inline review
          # comment on the changed line.
          prompt: >-
            /code-review:code-review --comment
            Review this pull request for security defects. Report a finding only when you
            can write out the input, the path it takes through the code, and the effect.
            Anything you cannot prove that way is dropped rather than reported.

          # NON OBVIOUS LINE 2 OF 2.
          # --allowedTools has to name the inline comment tool even though the code-review
          # skill's own frontmatter already names it. The action only starts that MCP
          # server when --allowedTools names the tool. Omit this line and you get a silent
          # empty review: a green tick, no comments, and nothing in the log saying why.
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
