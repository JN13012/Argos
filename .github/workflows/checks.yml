name: Argos checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run offline contract and CLI tests
        run: python -m unittest discover -s tests -v
      - name: Check repository hygiene and syntax
        run: python scripts/check_repository.py
      - name: Reproduce the synthetic report
        run: |
          python -m argos report examples/offline/assessment.json --output .argos/report.md
          cmp examples/offline/report.md .argos/report.md
      - name: Check patch whitespace
        run: git show --format= --check HEAD

  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv and locked discovery dependencies
        run: |
          python -m pip install uv==0.11.31
          uv sync --locked --python "${{ matrix.python-version }}"
      - name: Test Discovery and preserve offline compatibility
        run: uv run --no-sync pytest
      - name: Exercise the synthetic vertical slice
        run: |
          uv run --no-sync argos discover businesses --activity "garage automobile" --location Marseille --demo --json .argos/discovery-demo.json
      - name: Check repository hygiene and syntax
        run: python scripts/check_repository.py

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dashboard dependencies
        run: npm ci
      - name: Check formatting, presentation contract and production build
        run: npm run check
      - name: Install browser for interaction tests
        run: npx playwright install --with-deps chromium
      - name: Check dashboard interactions on desktop and mobile
        run: npm run test:e2e
