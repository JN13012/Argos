[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "argos-discovery"
version = "0.1.0"
description = "Local business discovery with traceable observations and conservative scoring"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.10,<3",
  "httpx>=0.28,<0.29",
  "sqlalchemy>=2.0,<2.1",
  "typer>=0.15,<1",
  "selectolax>=0.3.28,<0.5",
]

[project.scripts]
argos = "argos.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<10"]

[tool.hatch.build.targets.wheel]
packages = ["argos"]

[tool.pytest.ini_options]
testpaths = ["tests", "tests_discovery"]
addopts = "-ra"
