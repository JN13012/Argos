[project]
name = "argos"
version = "0.1.0"
description = "Modular OSINT and cybersecurity platform"
requires-python = ">=3.14,<3.15"
dependencies = [
    "httpx>=0.28,<0.29",
]

[dependency-groups]
dev = [
    "pytest>=9,<10",
]

[build-system]
requires = ["uv_build>=0.11.31,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
